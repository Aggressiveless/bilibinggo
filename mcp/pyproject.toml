[project]
name = "binggo-mcp"
version = "2.0.0"
description = "Authenticated local Binggo control, automation and test server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
]

[project.scripts]
binggo-mcp = "binggo_mcp.server_v2:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["binggo_mcp*"]
